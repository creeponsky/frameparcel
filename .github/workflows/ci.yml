name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets:i18n
      - run: git diff --exit-code -- docs/community-assets
      - run: npm run check
      - run: npm run build
      - run: npm run test:sandbox
      - run: npm audit --audit-level=high
